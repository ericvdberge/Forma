services:
  # Everything in one container: app + API + media files. Open http://localhost:8080
  forma:
    build: .
    image: forma
    ports:
      - "8080:8080"
    volumes:
      # Uploaded images and their thumbnails, as plain files.
      - forma-assets:/app/assets
      # The SQLite database.
      - forma-data:/app/data
      # Plugins (docs/design/plugins.md): one folder per plugin. Writable, so they can be turned off or deleted in the app.
      - ./plugins:/app/plugins

volumes:
  forma-assets:
  forma-data:
