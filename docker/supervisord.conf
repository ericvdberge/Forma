; Runs Forma's three processes in one container and restarts any that exit.
; Their output goes to the container log (docker logs).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; S3-compatible media storage on /app/assets (the volume).
[program:storage]
command=/usr/local/bin/versitygw --port 127.0.0.1:7070 --quiet posix /app/assets
environment=ROOT_ACCESS_KEY="%(ENV_STORAGE_ACCESS_KEY)s",ROOT_SECRET_KEY="%(ENV_STORAGE_SECRET_KEY)s"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Forma API, reached through nginx at /api.
[program:api]
command=dotnet /app/api/Forma.Api.dll
directory=/app/api
environment=ASPNETCORE_URLS="http://127.0.0.1:5000",ConnectionStrings__Forma="Data Source=/app/data/forma.db",Database__SeedSampleData="%(ENV_FORMA_SAMPLE_DATA)s",Storage__ServiceUrl="http://127.0.0.1:7070",Storage__Bucket="media",Storage__AccessKey="%(ENV_STORAGE_ACCESS_KEY)s",Storage__SecretKey="%(ENV_STORAGE_SECRET_KEY)s"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Serves the CMS app and proxies /api to the API, on port 8080.
[program:nginx]
command=nginx -e stderr -g "daemon off;"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
